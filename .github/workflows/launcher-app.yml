name: Build Launcher APK
on:
  push:
    branches: [main]
    paths:
      - "launcher-app/**"
      - ".github/workflows/launcher-app.yml"
  workflow_dispatch:
permissions:
  contents: write   # لنشر الإصدار (Release)
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # مفتاح توقيع ثابت: بدونه يُنشأ مفتاح عشوائي في كل بناء ويرفض أندرويد
      # تثبيت النسخة الجديدة فوق القديمة. الشرح في README (قسم التوقيع).
      - name: Use fixed signing key
        env:
          KS: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            mkdir -p ~/.android
            echo "$KS" | base64 -d > ~/.android/debug.keystore
          else
            echo "::warning::السر DEBUG_KEYSTORE_BASE64 غير موجود. سيُوقَّع الـ APK بمفتاح عشوائي ولن يُثبَّت فوق نسخة سابقة."
          fi
      # المشروع بلا Gradle wrapper، و AGP 8.5 يتطلب Gradle 8.7 فأحدث
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - run: gradle assembleDebug --no-daemon
        working-directory: launcher-app
      - uses: actions/upload-artifact@v4
        with:
          name: MultiLauncher-apk
          path: launcher-app/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: launcher-latest
        run: |
          cp launcher-app/app/build/outputs/apk/debug/app-debug.apk launcher.apk
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "مشغّل التطبيقات (آخر نسخة)" --notes "-" --latest=false --target "$GITHUB_SHA"
          gh release edit "$TAG" --notes "تم البناء من الـ commit: $GITHUB_SHA"
          gh release upload "$TAG" launcher.apk --clobber
