<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>جدار الفيديو</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%8E%AC%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d1022;--panel:#171b33;--line:#2a3052;--ink:#f1efff;--mute:#9aa0c4;--accent:#ffb52e;--accent-ink:#241700;--glow:rgba(255,181,46,.35);color-scheme:dark;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#eeeef7;--panel:#fff;--line:#d5d6ea;--ink:#151735;--mute:#5b5f86;--accent:#b36b00;--accent-ink:#fff;--glow:rgba(179,107,0,.3);color-scheme:light}}
:root[data-theme="light"]{color-scheme:light;--bg:#eeeef7;--panel:#fff;--line:#d5d6ea;--ink:#151735;--mute:#5b5f86;--accent:#b36b00;--accent-ink:#fff;--glow:rgba(179,107,0,.3)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Readex Pro",system-ui,sans-serif;line-height:1.6;padding-bottom:110px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
button,select,input{font:inherit;color:var(--ink)}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);padding:14px 16px 12px;display:grid;gap:12px;border-bottom:1px solid var(--line)}
.row1{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:12px}
h1{margin:0;font-size:28px;font-weight:700;letter-spacing:-.01em;line-height:1.2}
#count{color:var(--mute);font-size:14px;font-weight:300}
.seg{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{border:0;background:transparent;padding:6px 14px;border-radius:9px;cursor:pointer;font-size:14px;color:var(--mute)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:600}
.add{display:flex;gap:8px;flex-wrap:wrap}
.add input{flex:1 1 240px;min-width:0;direction:ltr;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:14px}
.add input#copies{flex:0 0 76px;direction:ltr;text-align:center;padding:10px 8px}
.add input:placeholder-shown{direction:rtl;text-align:right}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:10px 16px;cursor:pointer;font-size:14px}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
#empty{margin:24px 16px;border:2px dashed var(--line);border-radius:20px;padding:56px 20px;text-align:center}
#empty h2{margin:0 0 6px;font-size:22px;font-weight:600}
#empty p{margin:0 0 20px;color:var(--mute);font-weight:300}
#grid{display:grid;gap:12px;padding:16px;grid-template-columns:repeat(var(--cols,2),minmax(0,1fr))}
#grid.stage{grid-template-columns:repeat(4,minmax(0,1fr))}
#grid.stack{grid-template-columns:minmax(0,1fr)}
.tile{background:#06070f;border-radius:18px;border:1px solid var(--line);overflow:hidden;display:flex;flex-direction:column;transition:box-shadow .25s,border-color .25s}
.tile.audio{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),0 10px 40px var(--glow)}
#grid.stage .tile.focus{grid-column:1/-1}
.box{position:relative;aspect-ratio:16/9;background:#000}
.box video,.box iframe{width:100%;height:100%;display:block;border:0;object-fit:contain}
.prog{position:absolute;inset:auto 0 0 0;height:3px;background:rgba(255,255,255,.15);pointer-events:none}
.prog b{display:block;height:100%;width:0;background:var(--accent)}
.bar{display:flex;align-items:center;gap:6px;padding:8px 10px;color:#fff}
.bar.over{position:absolute;inset:auto 0 3px 0;background:linear-gradient(transparent,rgba(0,0,0,.8));padding-top:28px;opacity:0;transition:opacity .2s}
.tile:hover .bar.over,.tile:focus-within .bar.over{opacity:1}
@media (hover:none){.bar.over{opacity:1}.ib{width:42px;height:42px}}
.ib{width:36px;height:36px;border-radius:10px;border:0;background:rgba(255,255,255,.14);color:#fff;display:inline-grid;place-items:center;cursor:pointer;flex:none}
.ib:hover{background:rgba(255,255,255,.25)}
.ib.danger:hover{background:#c23b3b}
.tile.audio .ib[aria-label="الصوت"]{background:var(--accent);color:var(--accent-ink)}
.nm{flex:1;min-width:0;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:300}
.eq{display:none;gap:2px;align-items:flex-end;height:16px}
.tile.audio .eq{display:flex}
.eq i{width:3px;height:30%;background:var(--accent);border-radius:2px}
.tile.audio.playing .eq i{animation:eq 0.9s ease-in-out infinite alternate}
.eq i:nth-child(2){animation-delay:.25s!important}.eq i:nth-child(3){animation-delay:.5s!important}
@keyframes eq{to{height:100%}}
@media (prefers-reduced-motion:reduce){.eq i{animation:none!important;height:70%}}
#dock{position:fixed;z-index:25;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:4px;padding:6px;border-radius:20px;background:color-mix(in srgb,var(--panel) 90%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);box-shadow:0 12px 40px rgba(0,0,0,.35);max-width:calc(100% - 16px);overflow-x:auto;scrollbar-width:none}
#dock button,#dock select{background:transparent;border:0;border-radius:14px;padding:8px 12px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-size:14px;min-height:40px;white-space:nowrap}
#dock button:hover,#dock select:hover{background:color-mix(in srgb,var(--ink) 10%,transparent)}
#dock #playAll{background:var(--accent);color:var(--accent-ink);font-weight:600}
#dock select option{color:#000;background:#fff}
.sep{width:1px;height:22px;background:var(--line)}
.note{color:var(--mute);font-size:12px;padding:0 20px 12px;font-weight:300}
body.drag::after{content:"أفلت الفيديوهات أو ملف PDF هنا";position:fixed;inset:10px;z-index:50;display:grid;place-items:center;border:3px dashed var(--accent);border-radius:24px;background:color-mix(in srgb,var(--bg) 85%,transparent);font-size:26px;font-weight:600;pointer-events:none}
#pdfPanel{margin:0 16px 16px;border:1px solid var(--line);border-radius:18px;background:var(--panel);overflow:hidden}
.pdfbar{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.pdfbar .nm{color:var(--ink);font-weight:600;flex:1 1 120px}
.pdfbar .btn{padding:6px 12px;border-radius:10px;min-width:38px}
#pdfInfo{color:var(--mute);font-size:13px}
#pdfBody{height:70vh;min-height:240px;resize:vertical;overflow:auto;direction:ltr;background:#525659;color:#fff;text-align:center;padding:8px}
#pdfBody canvas{display:block;margin:8px auto;background:#fff;max-width:none}
#pdfBody>p{margin:24px}
.kbd{display:none}
@media (hover:hover){.kbd{display:block}}
@media (max-width:620px){
 .top{position:relative}
 h1{font-size:22px}
 #grid{grid-template-columns:repeat(var(--colsm,1),minmax(0,1fr))}
 #grid.stage{grid-template-columns:repeat(2,minmax(0,1fr))}
 #grid.stack{grid-template-columns:minmax(0,1fr)}
 #dock .t{display:none}
 #dock{gap:2px}
 #dock button,#dock select{padding:8px}
}
</style>
</head>
<body>
<header class="top">
  <div class="row1">
    <div class="brand"><h1>جدار الفيديو</h1><span id="count"></span></div>
    <div class="seg" role="group" aria-label="طريقة العرض">
      <button data-m="grid" aria-pressed="true">شبكة</button>
      <button data-m="stage" aria-pressed="false">مسرح</button>
      <button data-m="stack" aria-pressed="false">عمود</button>
    </div>
  </div>
  <div class="add">
    <input type="text" id="url" placeholder="الصق رابط يوتيوب أو فيديو مباشر، وأكثر من رابط مسموح">
    <input type="number" id="copies" min="1" value="1" inputmode="numeric" aria-label="عدد الشاشات من نفس الرابط" title="عدد الشاشات من نفس الرابط">
    <button class="btn" id="addUrl">أضف الرابط</button>
    <button class="btn" id="pdfBtn">ملف PDF</button>
    <button class="btn pri" id="addFiles">فيديوهات من جهازك</button>
    <input type="file" id="file" accept="video/*" multiple hidden>
    <input type="file" id="pdfFile" accept="application/pdf,.pdf" hidden>
  </div>
</header>

<div id="empty">
  <h2>اسحب فيديوهاتك إلى هنا</h2>
  <p>شغّل كل ما تريد في وقت واحد، وركّز الصوت على شاشة واحدة.</p>
  <button class="btn pri" id="pick2">اختر فيديوهات من جهازك</button>
</div>
<main><div id="grid" class="grid"></div></main>
<section id="pdfPanel" hidden aria-label="عارض PDF">
  <div class="pdfbar">
    <span class="nm" id="pdfName"></span><span id="pdfInfo"></span>
    <button class="btn" id="pdfOut" aria-label="تصغير">−</button>
    <button class="btn" id="pdfIn" aria-label="تكبير">+</button>
    <button class="btn" id="pdfTab">فتح في تبويب</button>
    <button class="btn" id="pdfClose">إغلاق</button>
  </div>
  <div id="pdfBody" tabindex="0"></div>
</section>
<p class="note">اضغط على أي فيديو من جهازك لينتقل إليه الصوت. في يوتيوب استخدم زر الصوت. ملفاتك لا تُرفع لأي مكان.</p>
<p class="note kbd">المسطرة: تشغيل أو إيقاف الكل. M: كتم الكل. الأرقام 1 إلى 9: نقل الصوت إلى الشاشة المقابلة.</p>

<nav id="dock" aria-label="التحكم في كل الشاشات">
  <button id="playAll" aria-label="شغّل الكل"><svg viewBox="0 0 24 24" width="18" height="18"><path d="M8 5v14l11-7z" fill="currentColor"/></svg><span class="t">شغّل الكل</span></button>
  <button id="pauseAll" aria-label="أوقف الكل"><svg viewBox="0 0 24 24" width="18" height="18"><path d="M7 5h4v14H7zM13 5h4v14h-4z" fill="currentColor"/></svg><span class="t">أوقف</span></button>
  <button id="restart" aria-label="من البداية"><svg viewBox="0 0 24 24" width="18" height="18"><path d="M4 12a8 8 0 108-8M4 4v5h5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span class="t">من البداية</span></button>
  <span class="sep"></span>
  <button id="openAll" aria-label="افتح في تطبيق يوتيوب"><svg viewBox="0 0 24 24" width="18" height="18"><path d="M14 4h6v6M20 4l-9 9M18 14v5H5V6h5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span class="t">افتح في يوتيوب</span></button>
  <button id="muteAll" aria-label="كتم الكل"><svg viewBox="0 0 24 24" width="18" height="18"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path d="M17 9l5 6M22 9l-5 6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span class="t">كتم الكل</span></button>
  <select id="speed" aria-label="السرعة"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="1.5">1.5×</option><option value="2">2×</option></select>
</nav>

<script>
const $=s=>document.querySelector(s);
const grid=$('#grid'),fileIn=$('#file');
let tiles=[],audioTile=null,mode='grid',speed=1;
const YT='https://www.youtube-nocookie.com',YTW='https://www.youtube.com';
const P={
 play:'<path d="M8 5v14l11-7z" fill="currentColor"/>',
 pause:'<path d="M7 5h4v14H7zM13 5h4v14h-4z" fill="currentColor"/>',
 vol:'<path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path d="M16 9a4 4 0 010 6M18.5 6.5a8 8 0 010 11" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>',
 mute:'<path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path d="M17 9l5 6M22 9l-5 6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>',
 full:'<path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>',
 close:'<path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>'
};
const icon=n=>`<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">${P[n]}</svg>`;
const ytId=u=>{const m=u.match(/(?:youtu\.be\/|youtube(?:-nocookie)?\.com\/(?:watch\?(?:.*&)?v=|shorts\/|embed\/|live\/))([\w-]{11})/);return m?m[1]:null};
function countText(n){return n===0?'':n===1?'شاشة واحدة':n===2?'شاشتان':n<=10?n+' شاشات':n+' شاشة'}
function mkBtn(n,label,cls){const b=document.createElement('button');b.type='button';b.className='ib '+(cls||'');b.innerHTML=icon(n);b.title=label;b.setAttribute('aria-label',label);return b}
function uiPlaying(t,on){t.el.classList.toggle('playing',on);t.pp.innerHTML=icon(on?'pause':'play')}
function applyFocus(){tiles.forEach(t=>t.el.classList.toggle('focus',mode==='stage'&&t===(audioTile||tiles[0])))}
function render(){
  const n=tiles.length;
  $('#empty').hidden=n>0;
  $('#count').textContent=countText(n);
  const cols=n<=1?1:n<=4?2:n<=9?3:n<=16?4:Math.min(8,Math.ceil(Math.sqrt(n)));
  grid.style.setProperty('--cols',cols);
  grid.style.setProperty('--colsm',n<=2?1:n<=12?2:n<=30?3:4);
  grid.className=mode==='grid'?'grid':mode;
  applyFocus();
}
function setAudio(t){
  audioTile=t;
  tiles.forEach(x=>{const on=x===t;x.api.mute(!on);x.el.classList.toggle('audio',on);x.au.innerHTML=icon(on?'vol':'mute');x.au.setAttribute('aria-pressed',on)});
  applyFocus();
}
function build(kind,name,media,mk){
  const el=document.createElement('div');el.className='tile '+kind;
  const box=document.createElement('div');box.className='box';box.append(media);
  const pp=mkBtn('play','تشغيل أو إيقاف'),au=mkBtn('mute','الصوت'),fs=mkBtn('full','ملء الشاشة'),rm=mkBtn('close','حذف','danger');
  const nm=document.createElement('span');nm.className='nm';nm.textContent=name;
  const eq=document.createElement('span');eq.className='eq';eq.innerHTML='<i></i><i></i><i></i>';
  const bar=document.createElement('div');bar.className='bar';bar.append(pp,au,nm,eq,fs,rm);
  if(kind==='loc'){bar.classList.add('over');box.append(bar);el.append(box)}else{el.append(box,bar)}
  const t={el,pp,au,nm,box};
  t.api=mk(t);
  pp.onclick=()=>t.api.toggle();
  au.onclick=()=>setAudio(audioTile===t?null:t);
  fs.onclick=()=>{const f=box.requestFullscreen||box.webkitRequestFullscreen;if(f)f.call(box);else{const v=box.querySelector('video');if(v&&v.webkitEnterFullscreen)v.webkitEnterFullscreen()}};
  rm.onclick=()=>{t.api.destroy();el.remove();tiles=tiles.filter(x=>x!==t);if(audioTile===t)audioTile=null;render()};
  tiles.push(t);grid.append(el);render();t.api.rate(speed);
  return t;
}
function addVideo(src,name){
  const v=document.createElement('video');v.src=src;v.playsInline=true;v.muted=true;v.loop=true;v.preload='metadata';
  const t=build('loc',name,v,t=>({
    play:()=>v.play().catch(()=>{}),pause:()=>v.pause(),toggle:()=>v.paused?v.play().catch(()=>{}):v.pause(),
    mute:m=>{v.muted=m},restart:()=>{v.currentTime=0;v.play().catch(()=>{})},rate:r=>{v.playbackRate=r},
    destroy:()=>{v.pause();if(src.startsWith('blob:'))URL.revokeObjectURL(src)}}));
  const prog=document.createElement('div');prog.className='prog';prog.innerHTML='<b></b>';t.box.append(prog);
  v.onplay=()=>uiPlaying(t,true);v.onpause=()=>uiPlaying(t,false);
  v.ontimeupdate=()=>{if(v.duration)prog.firstChild.style.width=(v.currentTime/v.duration*100)+'%'};
  v.onclick=()=>setAudio(audioTile===t?null:t);
  v.onloadedmetadata=()=>{if(v.paused&&!v.currentTime)try{v.currentTime=0.05}catch(_){}};
  v.onerror=()=>{t.nm.textContent=name+' — تعذّر تشغيل هذا الفيديو'};
}
function addYouTube(id){
  const f=document.createElement('iframe');
  const org=/^https?:$/.test(location.protocol)?'&origin='+encodeURIComponent(location.origin):'';
  f.src=YT+'/embed/'+id+'?enablejsapi=1&playsinline=1&mute=1&rel=0'+org;
  f.loading='lazy';f.allow='autoplay; encrypted-media; picture-in-picture; fullscreen';f.allowFullscreen=true;
  f.title='فيديو يوتيوب '+id;f.referrerPolicy='strict-origin-when-cross-origin';
  let playing=false,muted=true;
  const post=(fn,args)=>{try{f.contentWindow.postMessage(JSON.stringify({event:'command',func:fn,args:args||[]}),YT)}catch(e){}};
  const t=build('yt','يوتيوب · '+id,f,t=>{
    const api={play:()=>{post('playVideo');playing=true;uiPlaying(t,true)},pause:()=>{post('pauseVideo');playing=false;uiPlaying(t,false)},
      toggle:()=>playing?api.pause():api.play(),mute:m=>{muted=m;post(m?'mute':'unMute')},
      restart:()=>{post('seekTo',[0,true]);api.play()},rate:r=>post('setPlaybackRate',[r]),destroy:()=>{}};
    return api;
  });
  t.yt=id;t.frame=f;t.sync=on=>{playing=on;uiPlaying(t,on)};
  t.onReady=()=>{post('setPlaybackRate',[speed]);post(muted?'mute':'unMute');if(playing)post('playVideo')};
  const lk=document.createElement('a');lk.href=YTW+'/watch?v='+id;lk.target='_blank';lk.rel='noopener';lk.textContent='فتح في التطبيق';lk.onclick=e=>{if(/Android/i.test(navigator.userAgent)){e.preventDefault();openYT(id)}};
  lk.style.cssText='color:#fff;font-size:12px;opacity:.8;text-decoration:underline;flex:none';
  t.nm.after(lk);
  f.onload=()=>{try{f.contentWindow.postMessage(JSON.stringify({event:'listening',id:1}),YT)}catch(e){}};
}
addEventListener('message',e=>{
  if(!/(^|\.)youtube(-nocookie)?\.com$/.test((()=>{try{return new URL(e.origin).hostname}catch(_){return''}})()))return;
  let d;try{d=typeof e.data==='string'?JSON.parse(e.data):e.data}catch(_){return}
  const t=d&&tiles.find(x=>x.frame&&x.frame.contentWindow===e.source);if(!t)return;
  if(!t.ready){t.ready=true;t.onReady()}
  const st=d.event==='onStateChange'?d.info:d.event==='infoDelivery'&&d.info?d.info.playerState:undefined;
  if(st===1||st===3)t.sync(true);else if(st===2)t.sync(false);else if(st===0)t.api.restart();
});
function openYT(id){
  const web=YTW+'/watch?v='+id,ua=navigator.userAgent;
  if(/Android/i.test(ua)){
    location.href='intent://www.youtube.com/watch?v='+id+'#Intent;scheme=https;package=com.google.android.youtube;S.browser_fallback_url='+encodeURIComponent(web)+';end';
  }else if(/iPhone|iPad|iPod/i.test(ua)){
    const tm=setTimeout(()=>{if(!document.hidden)location.href=web},1200);
    document.addEventListener('visibilitychange',()=>clearTimeout(tm),{once:true});
    location.href='youtube://www.youtube.com/watch?v='+id;
  }else window.open(web,'_blank','noopener');
}
function openAllYT(){
  const ids=tiles.filter(t=>t.yt).map(t=>t.yt);
  if(!ids.length){flash('لا توجد شاشات يوتيوب لفتحها');return}
  if(ids.length>1)flash('المتصفح قد يسمح بفتح الأول فقط، استخدم زر فتح في كل شاشة للباقي');
  ids.forEach((id,i)=>setTimeout(()=>openYT(id),i*800));
}
let flashT;function flash(msg){const n=document.querySelector('.note');if(n.dataset.o===undefined)n.dataset.o=n.textContent;n.textContent=msg;n.style.color='var(--accent)';clearTimeout(flashT);flashT=setTimeout(()=>{n.textContent=n.dataset.o;n.style.color=''},4500)}
function addFiles(list){[...list].forEach(f=>{if(f.type.startsWith('video/'))addVideo(URL.createObjectURL(f),f.name);else if(f.type==='application/pdf'||/\.pdf$/i.test(f.name))openPdf(f);else flash('نوع الملف غير مدعوم: '+f.name)})}
function addFromText(text){
  const inp=$('#url'),src=text===undefined?inp.value:text;
  let n=0,bad=0;const cp=$('#copies'),c=Math.max(1,Math.floor(+cp.value)||1);cp.value=c;
  if(c>50&&!confirm('ستفتح '+c+' شاشة لكل رابط، وقد يتجمد المتصفح. هل تريد المتابعة؟'))return;
  src.split(/\s+/).filter(Boolean).forEach(u=>{
    const id=ytId(u);
    if(id){for(let i=0;i<c;i++)addYouTube(id);n++}
    else if(/youtu\.?be/i.test(u)){bad++}
    else if(/^https?:\/\//i.test(u)){
      let nm=u;try{nm=decodeURIComponent(u.split('?')[0].split('/').pop())||u}catch(_){}
      for(let i=0;i<c;i++)addVideo(u,nm);n++}
    else bad++;
  });
  if(tiles.length>12)flash('عدد كبير من الشاشات ('+tiles.length+')، قد يبطؤ الجهاز. قلّل العدد إن حدث تقطيع');
  if(n){if(text===undefined)inp.value='';if(bad)flash('تم تجاهل '+bad+' رابط غير مدعوم')}
  else if(src.trim())flash('الرابط غير مدعوم. استخدم رابط فيديو يوتيوب أو رابط فيديو مباشر يبدأ بـ http')
}
let pdfDoc=null,pdfZoom=1,pdfUrl=null,pdfLoad=null,pdfIO=null;
const PDFJS='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
function loadPdfJs(){
  if(window.pdfjsLib)return Promise.resolve();
  return pdfLoad||(pdfLoad=new Promise((res,rej)=>{
    const sc=document.createElement('script');sc.src=PDFJS+'pdf.min.js';
    sc.onload=()=>{pdfjsLib.GlobalWorkerOptions.workerSrc=PDFJS+'pdf.worker.min.js';res()};
    sc.onerror=()=>{pdfLoad=null;rej(new Error('pdfjs'))};
    document.head.append(sc);
  }));
}
let pdfTok=0,pdfOpen=0;
async function openPdf(file){
  const tok=++pdfOpen;pdfTok++;const body=$('#pdfBody');
  if(pdfIO)pdfIO.disconnect();
  if(pdfDoc){pdfDoc.destroy();pdfDoc=null}
  $('#pdfPanel').hidden=false;$('#pdfName').textContent=file.name;$('#pdfInfo').textContent='';
  if(pdfUrl)URL.revokeObjectURL(pdfUrl);
  pdfUrl=URL.createObjectURL(file);pdfZoom=1;
  body.innerHTML='<p>جارٍ تحميل الملف…</p>';
  const top=$('.top');$('#pdfPanel').style.scrollMarginTop=(getComputedStyle(top).position==='sticky'?top.offsetHeight+8:8)+'px';
  $('#pdfPanel').scrollIntoView({behavior:'smooth',block:'start'});
  try{
    await loadPdfJs();
    const d=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise;
    if(tok!==pdfOpen){d.destroy();return}
    pdfDoc=d;
    await renderPdf();
  }catch(e){
    if(tok!==pdfOpen)return;
    pdfDoc=null;body.textContent='';
    const fr=document.createElement('iframe');fr.src=pdfUrl;fr.title=file.name;
    fr.style.cssText='width:100%;height:100%;border:0;background:#fff';body.append(fr);
  }
}
async function renderPdf(){
  const doc=pdfDoc;if(!doc)return;
  const tok=++pdfTok,body=$('#pdfBody');
  if(pdfIO)pdfIO.disconnect();
  pdfW=body.clientWidth;
  const w=Math.max(200,(pdfW-16)*pdfZoom),dpr=Math.min(2,devicePixelRatio||1);
  const p1=await doc.getPage(1);
  if(tok!==pdfTok)return;
  const v1=p1.getViewport({scale:1}),ratio=v1.height/v1.width;
  body.textContent='';
  pdfIO=new IntersectionObserver(es=>es.forEach(async e=>{
    if(!e.isIntersecting)return;
    const c=e.target;pdfIO.unobserve(c);
    try{
      const pg=await doc.getPage(+c.dataset.p),b=pg.getViewport({scale:1});
      let sc=w/b.width*dpr;
      const px=b.width*b.height*sc*sc;
      if(px>16e6)sc*=Math.sqrt(16e6/px);
      const vp=pg.getViewport({scale:sc});
      c.width=vp.width;c.height=vp.height;
      c.style.height=w*b.height/b.width+'px';
      await pg.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;
    }catch(_){}
  }),{root:body,rootMargin:'600px'});
  for(let i=1;i<=doc.numPages;i++){
    const c=document.createElement('canvas');c.dataset.p=i;
    c.style.width=w+'px';c.style.height=w*ratio+'px';
    body.append(c);pdfIO.observe(c);
  }
  $('#pdfInfo').textContent=doc.numPages+' صفحة · '+Math.round(pdfZoom*100)+'%';
}
function closePdf(){
  pdfTok++;pdfOpen++;
  if(pdfIO)pdfIO.disconnect();
  if(pdfDoc){pdfDoc.destroy();pdfDoc=null}
  if(pdfUrl){URL.revokeObjectURL(pdfUrl);pdfUrl=null}
  $('#pdfBody').textContent='';$('#pdfPanel').hidden=true;
}
const zoomPdf=d=>{if(!pdfDoc)return;pdfZoom=Math.min(3,Math.max(.5,+(pdfZoom+d).toFixed(2)));renderPdf()};
$('#pdfBtn').onclick=()=>$('#pdfFile').click();
$('#pdfFile').onchange=e=>{const f=e.target.files[0];if(f)openPdf(f);e.target.value=''};
$('#pdfIn').onclick=()=>zoomPdf(.25);
$('#pdfOut').onclick=()=>zoomPdf(-.25);
$('#pdfTab').onclick=()=>{if(pdfUrl)window.open(pdfUrl,'_blank','noopener')};
$('#pdfClose').onclick=closePdf;
let pdfRT,pdfW=0;addEventListener('resize',()=>{clearTimeout(pdfRT);pdfRT=setTimeout(()=>{const w=$('#pdfBody').clientWidth;if(pdfDoc&&w&&w!==pdfW)renderPdf()},300)});
$('#addFiles').onclick=$('#pick2').onclick=()=>fileIn.click();
fileIn.onchange=()=>{addFiles(fileIn.files);fileIn.value=''};
$('#addUrl').onclick=()=>addFromText();
$('#url').addEventListener('keydown',e=>{if(e.key==='Enter')addFromText()});
document.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{
  mode=b.dataset.m;document.querySelectorAll('.seg button').forEach(x=>x.setAttribute('aria-pressed',x===b));render();
});
$('#playAll').onclick=()=>tiles.forEach(t=>t.api.play());
$('#pauseAll').onclick=()=>tiles.forEach(t=>t.api.pause());
$('#restart').onclick=()=>tiles.forEach(t=>t.api.restart());
$('#openAll').onclick=openAllYT;
$('#muteAll').onclick=()=>setAudio(null);
$('#speed').onchange=e=>{speed=+e.target.value;tiles.forEach(t=>t.api.rate(speed))};
addEventListener('keydown',e=>{
  const tag=e.target.tagName;if(/INPUT|SELECT|TEXTAREA/.test(tag)||e.target.closest&&e.target.closest('#pdfPanel')||e.ctrlKey||e.metaKey||e.altKey)return;
  if(e.code==='Space'&&tag!=='BUTTON'){e.preventDefault();const any=tiles.some(t=>t.el.classList.contains('playing'));tiles.forEach(t=>any?t.api.pause():t.api.play())}
  else if(e.code==='KeyM')setAudio(null);
  else{const m=/^(?:Digit|Numpad)([1-9])$/.exec(e.code);if(m&&tiles[+m[1]-1])setAudio(tiles[+m[1]-1])}
});
let dragN=0;
addEventListener('dragenter',e=>{e.preventDefault();dragN++;document.body.classList.add('drag')});
addEventListener('dragleave',()=>{if(--dragN<=0){dragN=0;document.body.classList.remove('drag')}});
addEventListener('dragover',e=>e.preventDefault());
addEventListener('drop',e=>{e.preventDefault();dragN=0;document.body.classList.remove('drag');
  if(e.dataTransfer.files.length)addFiles(e.dataTransfer.files);else addFromText(e.dataTransfer.getData('text/uri-list')||e.dataTransfer.getData('text')||'')});
render();
</script>
